---
name: Bug report
description: A role does not do what its README says
labels: [bug]
body:
  - type: dropdown
    id: role
    attributes:
      label: Role
      options:
        - auditd
        - aide
        - fail2ban
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version of the collection or role
      placeholder: "1.5.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS of the target
      placeholder: Debian 13, Ubuntu 24.04, ...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output of the failing task
      render: text
  - type: textarea
    id: vars
    attributes:
      label: Variables you set for the role
      description: Please remove addresses and other private values.
      render: yaml
