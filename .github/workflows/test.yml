---
# Runs every role on every supported OS version, each in a fresh virtual machine.
name: test
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  role:
    name: ${{ matrix.role }} on ${{ matrix.os }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # bash with pipefail: a failed playbook in front of "| tee" fails the step
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        role: [auditd, aide, fail2ban]
        os: [debian-12, debian-13, ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    env:
      SSH: ssh -i tests/vm/key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR root@127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ansible and the virtual machine tools
        run: |
          pip install ansible-core
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils > /dev/null
      - name: Start the test machine
        run: tests/start-vm.sh ${{ matrix.os }}
      - name: A wrong value is refused before anything is changed
        run: |
          case "${{ matrix.role }}" in
            auditd)   wrong="auditd_enable_flag=9" ;;
            aide)     wrong="aide_db_keep=many" ;;
            fail2ban) wrong="fail2ban_loglevel=LOUD" ;;
          esac
          if ansible-playbook -i tests/inventory.ini playbooks/${{ matrix.role }}.yml -e "${wrong}" | tee /tmp/wrong.txt; then
            echo "The role accepted ${wrong}"
            exit 1
          fi
          grep -q 'changed=0 ' /tmp/wrong.txt
      - name: Run the role
        run: ansible-playbook -i tests/inventory.ini playbooks/${{ matrix.role }}.yml
      - name: A second run changes nothing
        run: |
          ansible-playbook -i tests/inventory.ini playbooks/${{ matrix.role }}.yml | tee /tmp/second.txt
          grep -q 'changed=0 ' /tmp/second.txt
      - name: A dry run works and would change nothing
        run: |
          ansible-playbook -i tests/inventory.ini playbooks/${{ matrix.role }}.yml --check --diff | tee /tmp/check.txt
          grep -q 'changed=0 ' /tmp/check.txt
      - name: Check the result on the machine
        run: $SSH 'bash -s' < tests/verify-${{ matrix.role }}.sh
      - name: Show the state of the machine after a failure
        if: failure()
        run: |
          $SSH 'systemctl --failed --no-pager; systemctl status ${{ matrix.role }} --no-pager -l; journalctl --no-pager -n 80' || true
          sudo tail -n 30 tests/vm/serial.log || true

  # one name for "every role passed on every OS" - used by the branch protection
  all:
    name: all tests
    needs: role
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every role passed on every OS
        run: test "${{ needs.role.result }}" = "success"
